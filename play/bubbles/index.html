<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bubbles / PitBraun Games</title>

  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/global.css">
  <link rel="stylesheet" href="../../shared/css/header.css">
  <link rel="stylesheet" href="../../shared/css/footer.css">
  <link rel="stylesheet" href="../../shared/css/responsive.css">

  <link rel="stylesheet" href="../css/game-layout.css">
  <link rel="stylesheet" href="./bubbles.css">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png">
</head>

<body class="game-page">

  <header class="game-header">
    <div class="game-header__inner">

      <a href="/" class="game-header__logo">
        <img src="/assets/images/play_logo_small.png" alt="PitBraun Games">
      </a>

      <nav class="game-header__nav">
        <a href="/" class="game-header__link">Home</a>
        <a href="/about/" class="game-header__link">About</a>
        <a href="/releases/" class="game-header__link">Releases</a>
        <a href="/play/" class="game-header__link active">Play</a>
        <a href="/contacts/" class="game-header__link">Contacts</a>
      </nav>

    </div>
  </header>

  <main class="game-main">
    <section class="game-stage">
      <div class="game-scale">
        <div class="game-wrap" id="gameWrap">

          <canvas id="gameCanvas"></canvas>

          <div class="hud">
            <div class="hudBox">
              <div class="hudLabel">Score</div>
              <div class="hudValue" id="scoreText">0</div>
            </div>

            <div class="hudBox" style="text-align:center;">
              <div class="hudLabel">Max Score</div>
              <div class="hudValue" id="maxScoreText">0</div>
            </div>

            <div class="hudBox" style="text-align:right;">
              <div class="hudLabel">Combo</div>
              <div class="hudValue" id="comboText">x1</div>
            </div>
          </div>

          <div class="centerPanel" id="menuPanel">
            <div class="card">
              <h1>
                <span class="titleLetter titleCyan">B</span>
                <span class="titleLetter titleYellow">U</span>
                <span class="titleLetter titlePink">B</span>
                <span class="titleLetter titleGreen">B</span>
                <span class="titleLetter titleCyan">L</span>
                <span class="titleLetter titleYellow">E</span>
                <span class="titleLetter titlePink">S</span>
              </h1>

              <p>
                Tap the screen. Match the color and split the big balls into pieces.
              </p>

              <button class="button" id="startButton">START</button>
            </div>
          </div>

          <div class="controlBar"></div>

          <div class="hint hidden">Tap to shoot.</div>

          <button class="pauseButton" id="pauseButton" aria-label="Pause game">
            <div class="pauseBars"></div>
          </button>

          <div class="buildVersion">Build V113</div>

        </div>
      </div>
    </section>
  </main>

  <footer class="game-footer">
    <p>
      Some images on this website are for illustrative purposes only<br>
      and may not represent actual gameplay.<br>
      © 2026 PitBraun Games
    </p>
  </footer>

  <script src="./bubbles.js?v=113"></script>

</body>
</html>
